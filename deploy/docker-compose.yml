services:
  web:
    image: ${FE_IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    # Каналы заявок конструктора (ORDER_*): файл пишет деплой из секретов GitHub.
    env_file:
      - web.env
    volumes:
      - orders:/app/data/orders
    networks:
      - studio

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - studio

networks:
  studio:
    # MTU сети сервера — 1450 (облако REG.RU). При 1500 у Docker крупные пакеты TLS теряются:
    # рукопожатие с pinhead.bitrix24.ru зависает, и заявки не уходят в Битрикс.
    driver_opts:
      com.docker.network.driver.mtu: "1450"

volumes:
  # Заявки, которые ещё не ушли в канал, переживают перезапуск и новый образ.
  orders:
  caddy_data:
  caddy_config:
