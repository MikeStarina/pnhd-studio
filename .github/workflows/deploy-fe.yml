name: Deploy Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    env:
      DEPLOY_ENV: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image refs
        id: meta
        run: |
          echo "tag=${DEPLOY_ENV}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"
          if [ -n "${{ vars.NEXT_PUBLIC_API_URL }}" ]; then
            echo "api_url=${{ vars.NEXT_PUBLIC_API_URL }}" >> "$GITHUB_OUTPUT"
          else
            echo "api_url=https://api.pnhd.ru" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          IMAGE="${{ steps.meta.outputs.image }}"
          docker build \
            --build-arg "NEXT_PUBLIC_API_URL=${{ steps.meta.outputs.api_url }}" \
            -t "${IMAGE}:${{ steps.meta.outputs.tag }}" \
            -t "${IMAGE}:${{ steps.meta.outputs.sha_tag }}" \
            .
          docker push "${IMAGE}:${{ steps.meta.outputs.tag }}"
          docker push "${IMAGE}:${{ steps.meta.outputs.sha_tag }}"

      - name: Make package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          name=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          curl -fsS -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/${{ github.repository_owner }}/packages/container/${name}" \
            -d '{"visibility":"public"}'

      - name: Prepare deploy bundle
        env:
          FE_IMAGE: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p deploy-bundle
          cp deploy/docker-compose.yml deploy-bundle/docker-compose.yml
          cp "deploy/Caddyfile.${DEPLOY_ENV}" deploy-bundle/Caddyfile
          # 644 so appleboy/scp-action (Docker) can read the file; VM step chmods 600
          {
            echo "FE_IMAGE=${FE_IMAGE}"
          } > deploy-bundle/.env
          chmod 644 deploy-bundle/.env

      - name: Upload deploy bundle to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "deploy-bundle/*"
          target: "/opt/studio-fe"
          strip_components: 1
          overwrite: true

      - name: Pull image and restart stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/studio-fe
            chmod 600 .env
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps
